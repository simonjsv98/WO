name: Publicera till GitHub Pages

on:
  push:
    branches: [main, claude/charming-rubin-ppchre, claude/determined-hypatia-7odkin]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # ODLA, the garden app, is published beside the training app at /odla/.
      - run: mkdir -p dist/odla && cp odla/index.html odla/scene.js odla/apple-touch-icon.png dist/odla/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
